(function(){
  const url='https://miltxoswnnkvuxsbmhzn.supabase.co';
  const key='sb_publishable_VHPrcZPIYJ8XNo0GqVhY5w_KbLWCd7n';
  const gate=document.getElementById('authGate'),screen=document.querySelector('.screen'),logout=document.getElementById('logoutButton');
  const form=document.getElementById('authForm'),error=document.getElementById('authError'),submit=document.getElementById('authSubmit');
  screen.inert=true;

  const client=window.supabase.createClient(url,key);
  let version=0;
  async function check(){
    const current=++version;
    screen.inert=true;gate.hidden=false;logout.hidden=true;
    const {data:{user},error:authError}=await client.auth.getUser();
    if(current!==version)return;
    if(authError||!user){error.textContent='Введите email и пароль.';return}
    const {data:profile,error:profileError}=await client.from('user_profiles').select('role').eq('user_id',user.id).single();
    if(current!==version)return;
    if(profileError||!['admin','seller'].includes(profile?.role)){error.textContent='Доступ не назначен. Обратитесь к администратору.';await client.auth.signOut();return}
    window.salesMapAuth={userId:user.id,role:profile.role,email:user.email};
    screen.inert=false;gate.hidden=true;logout.hidden=false;error.textContent='';
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();submit.disabled=true;error.textContent='Выполняется вход…';
    try{const {error:e}=await client.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value});document.getElementById('authPassword').value='';if(e){error.textContent='Неверный email или пароль.';return}await check()}catch(e){error.textContent='Ошибка соединения. Попробуйте ещё раз.'}finally{submit.disabled=false}
  });
  logout.addEventListener('click',async()=>{screen.inert=true;logout.hidden=true;await client.auth.signOut();window.salesMapAuth=null;error.textContent='Вы вышли из аккаунта.';gate.hidden=false});
  client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){version++;screen.inert=true;gate.hidden=false;logout.hidden=true;window.salesMapAuth=null}});
  check().catch(()=>{error.textContent='Не удалось проверить доступ. Обновите страницу.'});
})();

nel.classList.remove('hidden');$('panelBackdrop').classList.remove('hidden');panel.scrollTop=0;document.body.classList.add('panel-open')}function closePanel(){if(addingPoint&&$('panel').querySelector('form')){addingPoint=false;pending=null;$('addPointButton').textContent='＋ Добавить точку';$('addPointButton').setAttribute('onclick','startAddPoint()')}$('panel').classList.add('hidden');$('panelBackdrop').classList.add('hidden');document.body.classList.remove('panel-open');view='map';nav()}function nav(){let names=[['map','🗺️','Карта'],['sales','🧾','Продажи'],['stock','📦','Склад'],['debts','💳','Долги'],['profile','👤','Профиль']];$('nav').innerHTML=names.map(([id,ico,t])=>`<button class="nav ${view===id?'active':''}" onclick="switchView('${id}')"><b>${ico}</b>${t}</button>`).join('')}function switchView(v){view=v;nav();if(v==='map'){closePanel();return}if(v==='sales')showSales();if(v==='stock')showStock();if(v==='debts')showDebts();if(v==='profile')showProfile()}
function renderPins(){const q=$('search').value.toLowerCase();$('pins').innerHTML='';markers.forEach(m=>m.destroy?.());markers=[];data.locations.filter(l=>!q||l.name.toLowerCase().includes(q)||String(l.phone||'').includes(q)||String(l.owner||'').toLowerCase().includes(q)||data.boutiques.some(b=>b.marketId===l.id&&(b.name.toLowerCase().includes(q)||String(b.owner||'').toLowerCase().includes(q)||String(b.phone||'').includes(q)))).forEach(l=>{const btn=document.createElement('button');btn.className='marker '+(l.type==='market'?'market':balance(l.id)>0?'debt':'');btn.innerText=l.type==='market'?'🏬':'📍';btn.title=l.name;btn.type='button';btn.style.pointerEvents='auto';const openMarker=e=>{e.preventDefault();e.stopPropagation();showLocation(l.id)};let touchStart=null;btn.addEventListener('pointerdown',e=>{e.stopPropagation();if(e.pointerType!=='mouse')touchStart={x:e.clientX,y:e.clientY}});btn.addEventListener('pointerup',e=>{e.stopPropagation();if(e.pointerType==='mouse'||!touchStart)return;const moved=Math.hypot(e.clientX-touchStart.x,e.clientY-touchStart.y);touchStart=null;if(moved<14){openMarker(e);btn.dataset.justOpened=String(Date.now())}});btn.addEventListener('pointercancel',()=>{touchStart=null});btn.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});btn.addEventListener('click',e=>{if(Date.now()-Number(btn.dataset.justOpened||0)<600){e.preventDefault();e.stopPropagation();return}openMarker(e)});if(mapglMap&&window.mapgl){btn.style.position='relative';btn.style.left='auto';btn.style.top='auto';const mk=new mapgl.Marker(mapglMap,{coordinates:[l.lon,l.lat],element:btn});markers.push(mk)}else{btn.style.left=l.x+'%';btn.style.top=l.y+'%';$('pins').appendChild(btn)}})}
function showLocation(id){let l=data.locations.find(x=>x.id===id);if(!l)return;if(l.type!=='market'){selected=id;showClient(id);return}selected=id;let boutiques=data.boutiques.filter(b=>b.marketId===id);let html=`<div class="row"><h2>${esc(l.name)}</h2><button class="secondary" onclick="closePanel()">✕</button></div><p class="muted">${l.type==='market'?'Базар · '+boutiques.length+' бутиков':'Покупатель'} ${l.phone?'· '+esc(l.phone):''}</p>${ownerHtml(l)}${photoHtml(l)}`;if(l.type==='market'){html+=`<h3>Бутики</h3>`+boutiques.map(b=>`<div class="item"><div class="row"><strong>${esc(b.name)}</strong>${b.photo?`<img class="photo-thumb" src="${b.photo}" alt="Фото бутика">`:''}</div>${ownerHtml(b)}<div class="muted">Долг: ${money(balance(b.id))}</div><div class="actions"><button class="secondary" onclick="showClient('${b.id}')">Открыть</button></div></div>`).join('')+`<button onclick="addBoutique('${id}')">＋ Добавить бутик</button>`}else{html+=`<div class="notice">Долг: <strong>${money(balance(id))}</strong></div><div class="actions"><button onclick="newSale('${id}')">＋ Продажа</button></div>`}openPanel(html)}
function showClient(id){const b=data.boutiques.find(x=>x.id===id);const l=data.locations.find(x=>x.id===id);const obj=b||l;if(!obj)return;const sales=data.sales.filter(s=>s.targetId===id);const debt=balance(id);const phone=String(obj.phone||'').trim();const owner=String(obj.owner||'').trim();const photo=obj.photo?'<img class="shop-photo" src="'+obj.photo+'" alt="Фото магазина">':'<div class="shop-photo-empty">📷 Фото магазина не добавлено</div>';openPanel(`<div class="shop-card"><div class="shop-head"><h2 class="shop-title">${esc(obj.name||'Магазин')}</h2><button class="secondary" onclick="closePanel()" aria-label="Закрыть">✕</button></div><div class="shop-detail"><span class="shop-label">Владелец</span><span class="shop-value">${esc(owner||'Не указан')}</span></div><div class="shop-detail"><span class="shop-label">Номер</span><span class="shop-value">${phone?'<a href="tel:'+esc(phone.replace(/[^+0-9]/g,''))+'">'+esc(phone)+'</a>':'Не указан'}</span></div>${photo}<div class="shop-debt ${debt>0?'has-debt':''}"><span>Долг</span><strong>${money(debt)}</strong></div><div class="shop-actions"><button onclick="newSale('${id}')">＋ Продажа</button><button class="ghost" onclick="newPayment('${id}')">Принять оплату долга</button></div><div class="actions"><button class="secondary" onclick="editShop('${id}')">✏️ Редактировать магазин</button></div><section class="shop-history"><h3>История</h3>${sales.length?sales.slice().reverse().map(s=>`<div class="item"><strong>${esc(goods.find(g=>g.id===s.product)?.name||'Оплата долга')}</strong><div class="muted">${esc(s.date)} · ${s.qty} шт. · ${money(s.qty*s.price)} · Оплачено ${money(s.paid)}${actorLabel(s)}</div></div>`).join(''):'<p class="muted">Продаж пока нет</p>'}</section></div>`)}
function editShop(id){const obj=data.boutiques.find(x=>x.id===id)||data.locations.find(x=>x.id===id);if(!obj)return;openPanel(`<h2>Редактировать магазин</h2><form onsubmit="event.preventDefault();saveShopEdit(event.target,'${id}')"><label class="field">Название магазина<input name="name" required maxlength="120" value="${esc(obj.name||'')}"></label><label class="field">Владелец<input name="owner" maxlength="120" value="${esc(obj.owner||'')}"></label><label class="field">Номер телефона<input name="phone" type="tel" maxlength="30" value="${esc(obj.phone||'')}" placeholder="+7 700 000 00 00"></label><label class="field">Заменить фото (необязательно)<input name="photo" type="file" accept="image/*"></label><p class="photo-help">Если не выбирать новое фото, останется прежнее. В карточке показывается только одно фото.</p><div class="actions"><button type="submit">Сохранить изменения</button><button type="button" class="secondary" onclick="showClient('${id}')">Отмена</button></div></form>`)}
async function saveShopEdit(f,id){const obj=data.boutiques.find(x=>x.id===id)||data.locations.find(x=>x.id===id);if(!obj)return;const name=f.elements.name.value.trim(),owner=f.elements.owner.value.trim(),phone=f.elements.phone.value.trim();if(!name){alert('Введите название магазина');return}if(phone&&!/^[+\d\s()\-]{6,30}$/.test(phone)){alert('Проверьте номер телефона');return}const duplicate=data.boutiques.some(b=>b.id!==id&&b.marketId===obj.marketId&&b.name.trim().toLowerCase()===name.toLowerCase());if(duplicate){alert('Бутик с таким названием уже есть на этом базаре');return}try{const newPhoto=f.elements.photo.files.length?await readPhoto(f.elements.photo):obj.photo;const before={name:obj.name,owner:obj.owner,phone:obj.phone,photo:obj.photo};Object.assign(obj,{name,owner,phone,photo:newPhoto});if(!save()){Object.assign(obj,before);return}renderPins();showClient(id)}catch(e){alert(e.message)}}
function addBoutique(marketId){openPanel(`<h2>Новый бутик</h2><form onsubmit="event.preventDefault();createBoutique(event.target,'${marketId}')"><label class="field">Номер / название бутика<input name="name" required placeholder="Бутик №102"></label><label class="field">Имя владельца<input name="owner" required placeholder="Имя владельца"></label><label class="field">Телефон владельца<input name="phone" type="tel" placeholder="+7…"></label><label class="field">Фото бутика / вывески<input name="photo" type="file" accept="image/*" capture="environment" required></label><p class="photo-help">Сфотографируйте вход или вывеску, чтобы другие команды легко нашли бутик.</p><button>Сохранить бутик</button></form>`)}
async function createBoutique(f,marketId){try{let name=f.elements.name.value.trim(),owner=f.elements.owner.value.trim();if(data.boutiques.some(b=>b.marketId===marketId&&b.name.trim().toLowerCase()===name.toLowerCase())){alert('Бутик с таким названием уже существует на этом базаре');return}let photo=await readPhoto(f.elements.photo);let b={id:'b'+Date.now(),marketId,name,owner,phone:f.elements.phone.value.trim(),photo};data.boutiques.push(b);if(!save()){data.boutiques.pop();return}showLocation(marketId)}catch(e){alert(e.message)}}
function startAddPoint(){addingPoint=true;pending=null;view='map';nav();$('addPointButton').textContent='✕ Отмена';$('addPointButton').setAttribute('onclick','cancelAddPoint()');openPanel('<h2>Выберите место</h2><p>Нажмите на карту, где находится магазин. После этого откроется форма добавления.</p><button type="button" class="secondary" onclick="cancelAddPoint()">Отмена</button>')}
function cancelAddPoint(){addingPoint=false;pending=null;$('addPointButton').textContent='＋ Добавить точку';$('addPointButton').setAttribute('onclick','startAddPoint()');closePanel()}
function openAdd(){view='map';nav();openPanel(`<h2>Добавить точку</h2><p class="muted">На настоящей карте нажмите нужное место; в демо используется примерное положение.</p><form onsubmit="event.preventDefault();createLocation(event.target)"><label class="field">Тип объекта<select name="type" onchange="toggleClientFields(this.value)"><option value="client">Покупатель / магазин</option><option value="market">Базар</option></select></label><label class="field">Название<input name="name" required placeholder="Название объекта"></label><div id="clientFields"><label class="field">Имя владельца<input name="owner" required placeholder="Имя владельца"></label><label class="field">Телефон владельца<input name="phone" type="tel" placeholder="+7…"></label><label class="field">Фото магазина / вывески<input name="photo" type="file" accept="image/*" capture="environment" required></label><p class="photo-help">Снимите вход или вывеску для распознавания точки при следующем визите.</p></div><button>Создать точку</button></form>`)}
function toggleClientFields(type){let fields=$('clientFields');fields.classList.toggle('hidden',type==='market');fields.querySelectorAll('[name="owner"],[name="photo"]').forEach(el=>el.required=type!=='market')}
async function createLocation(f){try{let type=f.elements.type.value,photo=type==='client'?await readPhoto(f.elements.photo):'';let x=35+Math.random()*35,y=30+Math.random()*35;let coords=pending||{lat:43.2389+(50-y)*.0004,lon:76.8897+(x-50)*.0005};let l={id:'c'+Date.now(),type,name:f.elements.name.value.trim(),owner:type==='client'?f.elements.owner.value.trim():'',phone:type==='client'?f.elements.phone.value.trim():'',photo,x,y,lat:coords.lat,lon:coords.lon};data.locations.push(l);if(!save()){data.locations.pop();return}pending=null;addingPoint=false;$('addPointButton').textContent='＋ Добавить точку';$('addPointButton').setAttribute('onclick','startAddPoint()');renderPins();showLocation(l.id)}catch(e){alert(e.message)}}
function newSale(id){let opts=goods.map(g=>`<option value="${g.id}">${esc(g.name)} — ${money(g.price)}</option>`).join('');openPanel(`<h2>Продажа · ${esc(targetName(id))}</h2><form onsubmit="event.preventDefault();recordSale(event.target,'${id}')"><label class="field">Товар<select name="product" onchange="this.form.price.value=goods.find(g=>g.id===this.value)?.price??0">${opts}</select></label><label class="field">Количество<input name="qty" type="number" min="1" step="1" required value="1"></label><label class="field">Цена за единицу, ₸ (можно изменить)<input name="price" type="number" min="0" step="0.01" required value="${goods[0]?.price??0}"></label><label class="field">Получено денег, ₸<input name="paid" type="number" min="0" step="0.01" required value="0"></label><div class="notice">Можно продавать ниже закупочной цены. Сумма и долг считаются по указанной цене. Продажа пока записывается только в этом браузере и не списывает остатки МоегоСклада.</div><button>Сохранить продажу</button></form>`)}
function recordSale(f,id){if(!window.salesMapAuth?.userId){alert('Сначала войдите в аккаунт');return}let g=goods.find(x=>x.id===f.product.value),qty=+f.qty.value,price=+f.price.value,paid=+f.paid.value;if(!g||!Number.isInteger(qty)||qty<1||!Number.isFinite(price)||price<0||!Number.isFinite(paid)||paid<0||paid>qty*price){alert('Проверьте количество, цену и оплату');return}data.sales.push({id:'s'+Date.now(),targetId:id,product:g.id,qty,price,paid,createdBy:window.salesMapAuth.userId,createdByEmail:window.salesMapAuth.email,date:new Date().toLocaleDateString('ru-RU')});save();showClient(id);renderPins()}

function newPayment(id){if(balance(id)<=0){alert('У клиента нет долга');return}openPanel(`<h2>Погашение долга</h2><p>Покупатель: ${esc(targetName(id))}</p><p>Долг: <b>${money(balance(id))}</b></p><form onsubmit="event.preventDefault();recordPayment(event.target,'${id}')"><label class="field">Сумма оплаты, ₸<input name="amount" type="number" min="1" max="${balance(id)}" required></label><button>Записать оплату</button></form>`)}
function recordPayment(f,id){if(!window.salesMapAuth?.userId){alert('Сначала войдите в аккаунт');return}let a=+f.amount.value;if(a<=0||a>balance(id))return;data.sales.push({id:'p'+Date.now(),targetId:id,product:null,qty:0,price:0,paid:a,createdBy:window.salesMapAuth.userId,createdByEmail:window.salesMapAuth.email,date:new Date().toLocaleDateString('ru-RU')});save();showClient(id);renderPins()}
function actorLabel(s){return window.salesMapAuth?.role==='admin'?' · Оформил: '+esc(s.createdByEmail||'Неизвестно'):''}
function showSales(){openPanel(`<h2>Продажи</h2><div class="notice">Всего продаж: ${data.sales.filter(s=>s.qty>0).length} · Выручка: ${money(data.sales.reduce((a,s)=>a+s.qty*s.price,0))}</div>${data.sales.slice().reverse().map(s=>`<div class="item"><strong>${esc(targetName(s.targetId))}</strong><div class="muted">${esc(s.date)} · ${esc(goods.find(g=>g.id===s.product)?.name||'Оплата долга')} · ${money(s.qty*s.price||s.paid)}${actorLabel(s)}</div></div>`).join('')||'<p class="muted">Продаж пока нет</p>'}`)}
async function showStock(){
  openPanel('<h2>Склад · Береке базар</h2><div class="notice">Загружаем актуальные остатки и цены из МоегоСклада…</div>');
  try{
    const response=await fetch('/api/moysklad/stock',{cache:'no-store'});
    const result=await response.json();
    if(!response.ok)throw Error(result.error||'Ошибка загрузки');
    openPanel(`<h2>Склад · Береке базар</h2><div class="muted">Обновлено: ${esc(new Date(result.updatedAt).toLocaleString('ru-RU'))}</div><div class="notice">Остатки только главного склада. Нулевой остаток не скрывает товар. Продажи в этой демоверсии ещё не списывают товары в МоемСкладе.</div>${result.products.map(p=>`<div class="item"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.article||p.code)} · ${p.price===null?'Цена не указана':money(p.price)}</div><div>${p.stock<=0?'<span class="danger">Нет в наличии</span>':'В наличии: '+esc(p.stock)}</div></div>`).join('')}`);
  }catch(e){openPanel(`<h2>Склад · Береке базар</h2><div class="notice danger">Не удалось получить остатки: ${esc(e.message)}</div><button onclick="showStock()">Повторить</button>`)}
}
function showDebts(){let ids=[...data.locations.filter(l=>l.type==='client').map(l=>l.id),...data.boutiques.map(b=>b.id)];let debtors=ids.filter(id=>balance(id)>0);openPanel(`<h2>Долги покупателей</h2><div class="notice">Всего задолженность: <strong>${money(debtors.reduce((a,id)=>a+balance(id),0))}</strong></div>${debtors.map(id=>`<div class="item"><strong>${esc(targetName(id))}</strong><div class="muted">${money(balance(id))}</div><div class="actions"><button class="secondary" onclick="showClient('${id}')">Открыть</button></div></div>`).join('')||'<p class="muted">Долгов пока нет</p>'}`)}
function showProfile(){openPanel(`<h2>Настройки и интеграции</h2><p class="muted">Прототип хранит данные и сжатые фотографии только в этом браузере (localStorage). Фото могут исчезнуть при очистке браузера. Не используйте реальные персональные данные до настройки защищённого сервера и хранилища фотографий.</p><form onsubmit="event.preventDefault();data.key=event.target.key.value.trim();save();location.reload()"><label class="field">API-ключ 2ГИС MapGL<input name="key" value="${esc(data.key||'')}" placeholder="Введите ключ MapGL"></label><button>Подключить карту 2ГИС</button></form><p class="muted">Ключ сохраняется локально в браузере. Для промышленной версии понадобится корректная настройка доступа, лицензии и серверной инфраструктуры.</p><div class="item"><strong>МойСклад</strong><p class="muted">Не подключён. Интеграция будет выполняться через защищённый сервер, а не из браузера.</p></div><button class="secondary" onclick="if(confirm('Удалить все демонстрационные данные?')){localStorage.removeItem(STORE);location.reload()}">Сбросить демо</button>`)}
let buildingRequestId=0;
function buildingAddButton(lon,lat){return '<button type="button" onclick="addPointAt('+Number(lon)+','+Number(lat)+')">＋ Добавить точку здесь</button>'}
function addPointAt(lon,lat){addingPoint=true;pending={lon,lat};openAdd()}
async function showBuildingInfo(lon,lat){
  const requestId=++buildingRequestId;
  openPanel('<h2>Информация о месте</h2><p class="muted">Загружаем данные 2ГИС…</p>');
  try{
    const response=await fetch('/api/2gis/place?lon='+encodeURIComponent(lon)+'&lat='+encodeURIComponent(lat));
    const payload=await response.json();
    if(requestId!==buildingRequestId||$('panel').classList.contains('hidden'))return;
    if(!response.ok)throw new Error(payload.error||'Сервис временно недоступен');
    const place=payload.place;
    if(!place){
      openPanel('<h2>Место на карте</h2><p>Здание или организация здесь не найдены.</p><p class="muted">Координаты: '+lat.toFixed(5)+', '+lon.toFixed(5)+'</p>');
      return;
    }
    openPanel('<h2>'+esc(place.name||'Здание')+'</h2>'+(place.address?'<p><strong>Адрес:</strong> '+esc(place.address)+'</p>':'')+(place.type?'<p class="muted">'+esc(place.type)+'</p>':'')+'<p class="muted">Данные 2ГИС</p>'+buildingAddButton(lon,lat));
  }catch(error){
    if(requestId!==buildingRequestId||$('panel').classList.contains('hidden'))return;
    openPanel('<h2>Место на карте</h2><p class="muted">Не удалось получить сведения 2ГИС: '+esc(error.message)+'</p><p>Координаты: '+lat.toFixed(5)+', '+lon.toFixed(5)+'</p>');
  }
}
function initMap(){if(!data.key)return;let script=document.createElement('script');script.src='https://mapgl.2gis.com/api/js/v1';script.onload=()=>{try{window.mapglMap=mapglMap=new mapgl.Map('map',{center:[76.8897,43.2389],zoom:12,key:data.key});$('demo').remove();$('demoNote').remove();mapglMap.on('click',e=>{const coords=e.lngLat;if(!coords)return;const zoom=typeof mapglMap.getZoom==='function'?mapglMap.getZoom():12;const metersPerPixel=156543.03392*Math.cos(coords[1]*Math.PI/180)/Math.pow(2,zoom);const tolerance=Math.max(20,Math.min(5000,44*metersPerPixel));let closest=null,dist=Infinity;for(const l of data.locations){if(!Number.isFinite(+l.lat)||!Number.isFinite(+l.lon))continue;const dy=(+l.lat-coords[1])*111320;const dx=(+l.lon-coords[0])*111320*Math.cos(coords[1]*Math.PI/180);const d=Math.hypot(dx,dy);if(d<dist){closest=l;dist=d}}if(addingPoint){pending={lon:coords[0],lat:coords[1]};openAdd();return}if(closest&&dist<=tolerance){showLocation(closest.id);return}showBuildingInfo(coords[0],coords[1])});renderPins()}catch(e){$('demoNote').textContent='Не удалось подключить 2ГИС: '+e.message}};script.onerror=()=>{$('demoNote').textContent='Не удалось загрузить библиотеку 2ГИС. Проверьте интернет и ключ.'};document.head.appendChild(script)}
nav();renderPins();initMap();
</script></body></html>
